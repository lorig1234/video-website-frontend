<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
    <script src="config.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #2d2d2d; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container { 
            width: 100%; 
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
        }
        .video-js { 
            width: 100%;
            height: calc(100vh - 40px);
            max-height: 720px;
        }
        .error-message { 
            color: white; 
            text-align: center; 
            padding: 20px; 
            background: rgba(255, 0, 0, 0.7);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1000;
            text-decoration: none;
        }
        .back-button:hover {
            background: rgba(0, 0, 0, 0.7);
        }
        .nav-buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .episode-nav-button {
            padding: 10px 20px;
            background: rgba(0, 123, 255, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }
        .episode-nav-button:hover:not(:disabled) {
            background: rgba(0, 123, 255, 1);
        }
        .episode-nav-button:disabled {
            background: rgba(100, 100, 100, 0.5);
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Next Episode Countdown Overlay */
        .next-episode-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1.5rem;
            font-family: 'Inter', Arial, sans-serif;
        }

        .next-episode-overlay.show {
            display: flex;
        }

        .next-ep-title {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .next-ep-name {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            max-width: 80%;
        }

        .countdown-ring {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .countdown-ring svg {
            transform: rotate(-90deg);
        }

        .countdown-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .countdown-ring .ring-bg {
            stroke: #444;
        }

        .countdown-ring .ring-progress {
            stroke: #007bff;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .next-ep-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .next-ep-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', Arial, sans-serif;
        }

        .next-ep-play {
            background: #007bff;
            color: white;
        }

        .next-ep-play:hover {
            background: #0056b3;
        }

        .next-ep-cancel {
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
        }

        .next-ep-cancel:hover {
            color: white;
            border-color: #888;
        }
    </style>
</head>
<body>
    <a href="/" class="back-button" id="back-button">← Back to Videos</a>
    <div class="video-container">
        <video 
            id="my-video" 
            class="video-js vjs-big-play-centered vjs-fluid" 
            controls 
            preload="metadata"
            playsinline
            webkit-playsinline
            x-webkit-airplay="allow"
            crossorigin="anonymous">
            Your browser does not support HTML5 video.
        </video>
        <div id="error-message" class="error-message"></div>

        <!-- Next Episode Countdown Overlay -->
        <div id="next-episode-overlay" class="next-episode-overlay">
            <div class="next-ep-title">NEXT EPISODE</div>
            <div class="next-ep-name" id="next-ep-name"></div>
            <div class="countdown-ring">
                <svg width="100" height="100">
                    <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
                    <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="45" 
                        stroke-dasharray="283" stroke-dashoffset="0"></circle>
                </svg>
                <div class="countdown-number" id="countdown-number">5</div>
            </div>
            <div class="next-ep-buttons">
                <button class="next-ep-btn next-ep-play" id="next-ep-play-btn">▶ Play Now</button>
                <button class="next-ep-btn next-ep-cancel" id="next-ep-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
    <div class="nav-buttons">
        <button class="episode-nav-button" id="prev-episode" disabled>← Previous Episode</button>
        <button class="episode-nav-button" id="next-episode" disabled>Next Episode →</button>
    </div>

    <script>
        // Check authentication
        if (!Auth.isLoggedIn()) {
            window.location.href = '/login.html';
        }

        let lastSavedProgress = 0;
        let videoDuration = 0;
        let currentEpisodeId = null;
        let showData = null;
        let nextEpisode = null;
        let countdownTimer = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id');
            const movieId = urlParams.get('movie');
            const startTime = parseInt(urlParams.get('t')) || 0;
            const shouldAutoplay = urlParams.get('autoplay') === '1';
            const isMovie = !!movieId;
            currentEpisodeId = videoId || movieId;
            
            console.log('Player initialized with videoId:', videoId, 'movieId:', movieId, 'startTime:', startTime, 'autoplay:', shouldAutoplay);
            
            const errorElement = document.getElementById('error-message');
            const backButton = document.getElementById('back-button');
            const prevButton = document.getElementById('prev-episode');
            const nextButton = document.getElementById('next-episode');
            
            function showError(message) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            if (!videoId && !movieId) {
                showError('No video ID provided');
                return;
            }

            // === MOVIE MODE ===
            if (isMovie) {
                backButton.href = '/';
                // Hide episode nav buttons for movies
                prevButton.style.display = 'none';
                nextButton.style.display = 'none';

                // Fetch movie details for title
                fetch(API.movieDetails(movieId))
                    .then(r => r.json())
                    .then(data => {
                        document.title = data.title + (data.year ? ` (${data.year})` : '') + ' — Player';
                    })
                    .catch(() => {});
            }

            // === TV SHOW MODE ===
            if (!isMovie) {
            // Extract show ID from video ID (format: showid_s##_e##)
            // Handle both formats: "showid_s01_e01" and "showid_episodenumber"
            const showIdMatch = videoId.match(/^(.+?)_s\d+_e\d+/i);
            const showId = showIdMatch ? showIdMatch[1] : videoId.substring(0, videoId.lastIndexOf('_'));
            
            if (showId) {
                backButton.href = `/#show=${showId}`;
                
                console.log('Fetching show data for showId:', showId);
                
                // Fetch show data to get all episodes
                fetch(API.showDetails(showId))
                    .then(response => response.json())
                    .then(data => {
                        showData = data;
                        console.log('Show data loaded:', data.title);
                        
                        // Flatten all episodes from all seasons
                        let allEpisodes = [];
                        data.seasons.forEach(season => {
                            allEpisodes = allEpisodes.concat(season.episodes);
                        });
                        
                        // Find current episode index
                        const currentIndex = allEpisodes.findIndex(ep => ep.id === videoId);
                        
                        if (currentIndex > 0) {
                            // Enable previous button
                            prevButton.disabled = false;
                            prevButton.onclick = function() {
                                saveProgress(true); // Save before navigating
                                window.location.href = `/player?id=${allEpisodes[currentIndex - 1].id}`;
                            };
                        }
                        
                        if (currentIndex < allEpisodes.length - 1) {
                            // Store next episode for auto-play
                            nextEpisode = allEpisodes[currentIndex + 1];

                            // Enable next button
                            nextButton.disabled = false;
                            nextButton.onclick = function() {
                                saveProgress(true); // Save before navigating
                                window.location.href = `/player?id=${nextEpisode.id}&autoplay=1`;
                            };
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching show data:', error);
                    });
            }
            } // end if (!isMovie)

            const player = videojs('my-video', {
                controls: true,
                fluid: true,
                responsive: true,
                playbackRates: [0.5, 1, 1.5, 2],
                html5: {
                    nativeTextTracks: false
                }
            });

            // Set video source
            const streamUrl = isMovie ? API.movieStream(movieId) : API.stream(videoId);
            console.log('Setting video source:', streamUrl);
            player.src({
                src: streamUrl,
                type: 'video/mp4'
            });

            // Load subtitles if available
            const subtitleId = isMovie ? movieId : videoId;
            fetch(API.subtitles(subtitleId))
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data || !data.subtitles || data.subtitles.length === 0) return;
                    data.subtitles.forEach((track, index) => {
                        player.addRemoteTextTrack({
                            kind: 'subtitles',
                            src: track.url,
                            srclang: track.language,
                            label: track.language.toUpperCase(),
                            default: index === 0
                        }, false);
                    });
                    console.log('Subtitles loaded:', data.subtitles.length, 'track(s)');
                })
                .catch(() => {});

            // Preload metadata for faster seeking
            player.load();

            player.on('error', function() {
                const error = player.error();
                console.error('Player error:', error);
                showError('Error playing the video. Please try again.');
            });

            // Handle waiting/buffering states
            player.on('waiting', function() {
                console.log('Player waiting/buffering...');
            });

            player.on('playing', function() {
                console.log('Player started playing');
            });

            player.on('stalled', function() {
                console.warn('Player stalled, attempting to recover...');
                // Try to restart playback if stalled
                setTimeout(() => {
                    if (player.paused() && player.readyState() < 3) {
                        console.log('Attempting to restart playback');
                        player.load();
                    }
                }, 3000);
            });

            player.on('loadedmetadata', function() {
                console.log('Video metadata loaded successfully, duration:', player.duration());
                videoDuration = player.duration();
                
                // Seek to start time if provided - with retry for Safari
                if (startTime > 0 && startTime < videoDuration) {
                    console.log('Attempting to seek to:', startTime);
                    
                    // Safari sometimes needs a small delay before seeking
                    setTimeout(() => {
                        player.currentTime(startTime);
                        console.log('Seeked to:', startTime, 'actual position:', player.currentTime());
                    }, 100);
                }
            });

            // Additional event to handle Safari's quirks
            player.on('canplay', function() {
                console.log('Video can play, current time:', player.currentTime());
                
                // Double-check the start time is set (Safari workaround)
                if (startTime > 0 && Math.abs(player.currentTime() - startTime) > 5) {
                    console.log('Correcting start time to:', startTime);
                    player.currentTime(startTime);
                }

                // Auto-play if coming from next episode transition
                if (shouldAutoplay) {
                    console.log('Auto-playing video');
                    player.play().catch(err => console.log('Autoplay blocked by browser:', err));
                }
            });

            // Auto-play next episode when current one ends
            player.on('ended', function() {
                console.log('Video ended, nextEpisode:', nextEpisode);
                saveProgress(true);

                if (!nextEpisode) return;

                const overlay = document.getElementById('next-episode-overlay');
                const epName = document.getElementById('next-ep-name');
                const countdownNum = document.getElementById('countdown-number');
                const ringProgress = document.getElementById('ring-progress');
                const playBtn = document.getElementById('next-ep-play-btn');
                const cancelBtn = document.getElementById('next-ep-cancel-btn');

                // Show overlay with next episode name
                epName.textContent = nextEpisode.title || nextEpisode.id;
                overlay.classList.add('show');

                const circumference = 2 * Math.PI * 45; // 283
                let secondsLeft = 5;
                countdownNum.textContent = secondsLeft;
                ringProgress.style.strokeDashoffset = '0';

                function goToNext() {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    window.location.href = `/player?id=${nextEpisode.id}&autoplay=1`;
                }

                function cancelCountdown() {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    overlay.classList.remove('show');
                }

                // Start countdown
                countdownTimer = setInterval(() => {
                    secondsLeft--;
                    countdownNum.textContent = secondsLeft;
                    // Animate ring: offset goes from 0 to full circumference
                    const offset = circumference * ((5 - secondsLeft) / 5);
                    ringProgress.style.strokeDashoffset = offset;

                    if (secondsLeft <= 0) {
                        goToNext();
                    }
                }, 1000);

                // Button handlers
                playBtn.onclick = goToNext;
                cancelBtn.onclick = cancelCountdown;
            });

            // Save progress periodically while playing
            player.on('timeupdate', function() {
                const currentTime = Math.floor(player.currentTime());
                // Save every 10 seconds of progress
                if (currentTime - lastSavedProgress >= 10) {
                    console.log('Triggering save at', currentTime, 'seconds');
                    saveProgress();
                }
            });

            // Save progress when paused
            player.on('pause', function() {
                saveProgress();
            });

            // Save progress when leaving the page
            window.addEventListener('beforeunload', function() {
                saveProgress(true);
            });

            // Save progress function
            async function saveProgress(immediate = false) {
                console.log('saveProgress called, immediate:', immediate, 'authenticated:', Auth.isLoggedIn());
                
                if (!currentEpisodeId || !Auth.isLoggedIn()) {
                    console.warn('Cannot save: episodeId=', currentEpisodeId, 'loggedIn=', Auth.isLoggedIn());
                    return;
                }
                
                const currentTime = Math.floor(player.currentTime());
                const duration = Math.floor(videoDuration);
                
                console.log('Progress:', currentTime, '/', duration, 'lastSaved:', lastSavedProgress);
                
                // Don't save if no significant change
                if (!immediate && Math.abs(currentTime - lastSavedProgress) < 5) {
                    console.log('Skipping save - no significant change');
                    return;
                }
                
                lastSavedProgress = currentTime;

                // Extract show_id from episode_id (format: show_id_s##_e##)
                const showIdMatch = currentEpisodeId.match(/^(.+?)_s\d+_e\d+/i);
                const showId = isMovie ? currentEpisodeId : (showIdMatch ? showIdMatch[1] : currentEpisodeId.substring(0, currentEpisodeId.lastIndexOf('_')));
                
                console.log('Extracted showId:', showId, 'from episodeId:', currentEpisodeId);
                
                // Get episode and show titles from showData if available
                let episodeTitle = '';
                let showTitle = '';
                if (showData && showData.title) {
                    showTitle = showData.title;
                    // Find the episode in the show data
                    if (showData.seasons && Array.isArray(showData.seasons)) {
                        for (const season of showData.seasons) {
                            if (season.episodes && Array.isArray(season.episodes)) {
                                const episode = season.episodes.find(ep => ep.id === currentEpisodeId);
                                if (episode) {
                                    episodeTitle = episode.title;
                                    break;
                                }
                            }
                        }
                    }
                }

                const payload = {
                    show_id: showId,
                    episode_id: currentEpisodeId,
                    position_seconds: currentTime,
                    duration_seconds: duration,
                    show_title: showTitle,
                    episode_title: episodeTitle
                };
                
                console.log('Saving progress with payload:', payload);

                try {
                    const response = await Auth.fetch(API.user.watchProgress, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('✅ Progress saved successfully:', data);
                    } else {
                        const errorText = await response.text();
                        console.error('❌ Failed to save progress:', response.status, errorText);
                    }
                } catch (error) {
                    console.error('❌ Error saving progress:', error);
                }
            }
        });
    </script>
</body>
</html>
